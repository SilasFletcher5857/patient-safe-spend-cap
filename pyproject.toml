[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patient-safe-spend-cap"
version = "0.1.0"
description = "A capped appointment notification service using one Infrai credential."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "openai>=1.50,<2",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/health_spend_guard"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

